[project]
name = "agent-operator-contract"
version = "1.0.3"
description = "Operator contract between coding-agent engines and their consumers: spec, fixtures, conformance suite, shared library and the agentfleet client."
readme = "README.md"
authors = [{ name = "Łukasz Bacik" }]
requires-python = ">=3.11"
# The shared library and agentfleet are stdlib only (docs/adoption-plan.md, step 1).
dependencies = []

[project.scripts]
agentfleet = "agent_operator_contract.agentfleet:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
